<!DOCTYPE html> 
<html> 
<head> 
    <title>Hangman Game</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head> 
<body> 
    <h1>Welcome to Hangman</h1> 
    <form action="{{ url_for('start') }}" method="post">
        <label>Select difficulty:</label> 
        <select class="selector" name="difficulty">
            <option class="selector" value="easy">Easy</option> 
            <option class="selector" value="medium">Medium</option> 
            <option class="selector" value="hard">Hard</option> 
            <option class="selector" value="insane">Insane</option>
        </select> 
        <button type="submit">Start Game</button>
    </form> 
</body>
</html>
